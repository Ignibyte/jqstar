<form role="search">
  <label for="component-query">Search components</label>
  <div data-jqs="search-field">
    <span data-part="icon" aria-hidden="true">⌕</span>
    <input
      id="component-query"
      data-part="control"
      type="search"
      name="query"
      placeholder="Search by name or capability"
    />
    <button data-part="clear" type="button">Clear</button>
    <button data-part="submit" type="submit">Search</button>
  </div>
</form>
