<div
  id="workspace-panels"
  data-jqs="resizable"
  data-value="[30,70]"
  data-step="5"
  data-storage-key="workspace"
>
  <aside id="workspace-navigation" data-part="panel" data-min="20" data-max="55">
    <h2>Navigation</h2>
    <p>This panel can be resized with pointer, touch, or keyboard.</p>
  </aside>
  <div data-part="handle" aria-label="Resize navigation"></div>
  <section data-part="panel" data-min="30">
    <h2>Workspace</h2>
    <p>Press Arrow keys on the splitter, Home or End for its limits, and Enter to collapse.</p>
  </section>
</div>
