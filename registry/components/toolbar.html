<div data-jqs="toolbar" aria-label="Text formatting">
  <button data-jqs="toggle" data-part="item" data-value="bold" type="button" aria-label="Bold">
    <strong>B</strong>
  </button>
  <button data-jqs="toggle" data-part="item" data-value="italic" type="button" aria-label="Italic">
    <em>I</em>
  </button>
  <button
    data-jqs="toggle"
    data-part="item"
    data-value="underline"
    type="button"
    aria-label="Underline"
  >
    <u>U</u>
  </button>
  <span data-part="separator" aria-hidden="true"></span>
  <button data-part="item" data-value="link" type="button">Add link</button>
</div>
