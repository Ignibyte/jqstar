<div
  data-jqs="toggle-group"
  data-type="multiple"
  data-name="formatting"
  aria-label="Text formatting"
>
  <button data-part="item" data-value="bold" type="button"><strong>B</strong></button>
  <button data-part="item" data-value="italic" type="button"><em>I</em></button>
  <button data-part="item" data-value="underline" type="button"><u>U</u></button>
</div>
