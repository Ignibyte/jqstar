<div data-jqs="file-upload" data-max-files="3" data-max-size="5242880">
  <input data-part="control" type="file" name="assets" accept="image/*,.pdf" multiple />
  <label data-part="dropzone">
    <span>
      <strong>Choose files</strong><br />
      or drop images and PDFs here, up to 5 MB each
    </span>
  </label>
  <ul data-part="list"></ul>
  <p data-part="status"></p>
</div>
