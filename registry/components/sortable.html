<div data-jqs="sortable" data-name="priority">
  <ol data-part="list">
    <li data-part="item" data-value="design" data-label="Design system">
      <button data-part="handle" type="button">⋮⋮</button>
      <span data-part="label">Design system</span>
      <button data-part="up" type="button" aria-label="Move Design system up">↑</button>
      <button data-part="down" type="button" aria-label="Move Design system down">↓</button>
    </li>
    <li data-part="item" data-value="api" data-label="API contract">
      <button data-part="handle" type="button">⋮⋮</button>
      <span data-part="label">API contract</span>
      <button data-part="up" type="button" aria-label="Move API contract up">↑</button>
      <button data-part="down" type="button" aria-label="Move API contract down">↓</button>
    </li>
    <li data-part="item" data-value="docs" data-label="Documentation">
      <button data-part="handle" type="button">⋮⋮</button>
      <span data-part="label">Documentation</span>
      <button data-part="up" type="button" aria-label="Move Documentation up">↑</button>
      <button data-part="down" type="button" aria-label="Move Documentation down">↓</button>
    </li>
  </ol>
  <p data-part="status"></p>
</div>
