<section data-jqs="feed" data-cursor="2" data-auto aria-labelledby="component-feed-title">
  <h2 id="component-feed-title">Component results</h2>
  <p>Use Page Up and Page Down to move between results.</p>
  <div data-part="content">
    <article data-jqs="item" data-part="item">
      <div data-part="media" aria-hidden="true">JS</div>
      <div data-part="content">
        <h3 data-part="title">jQuery Star</h3>
        <p data-part="description">Reactive HTML components powered by real jQuery.</p>
      </div>
    </article>
    <article data-jqs="item" data-part="item">
      <div data-part="media" aria-hidden="true">DS</div>
      <div data-part="content">
        <h3 data-part="title">Datastar</h3>
        <p data-part="description">Server-driven signals and HTML patch events.</p>
      </div>
    </article>
  </div>
  <button data-part="more" type="button" data-on:click="@loadMoreResults">Load more</button>
  <div data-part="sentinel" aria-hidden="true"></div>
  <p data-part="status" aria-live="polite">2 results loaded.</p>
</section>
