<section data-jqs="message-scroller" data-threshold="48">
  <div data-part="viewport" aria-label="Support conversation">
    <div data-part="content">
      <article data-jqs="message" aria-label="Message from Support">
        <header data-part="header">
          <strong data-part="author">Support</strong>
          <time datetime="2026-08-28T09:40:00-05:00">9:40 AM</time>
        </header>
        <div data-part="content"><p>What would you like us to check?</p></div>
      </article>
      <article data-jqs="message" data-side="sent" aria-label="Message from You">
        <header data-part="header">
          <strong data-part="author">You</strong>
          <time datetime="2026-08-28T09:42:00-05:00">9:42 AM</time>
        </header>
        <div data-part="content"><p>Please verify the multipart submission.</p></div>
      </article>
    </div>
  </div>
  <button data-part="latest" type="button" hidden>
    <span data-part="latest-label">Latest</span>
  </button>
  <p data-part="status">New messages are announced without moving keyboard focus.</p>
</section>
