<div id="install-command" data-jqs="clipboard" data-success-message="Install command copied.">

  <button
    data-jqs="button"
    data-part="trigger"
    data-size="sm"
    data-variant="outline"
    type="button"
    data-on:click="@ui.clipboard.copy"

    Copy
  </button>
  <span data-part="status"></span>
</div>
