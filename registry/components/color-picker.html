<label for="accent-color">Accent color</label>
<div data-jqs="color-picker">
  <input id="accent-color" data-part="control" type="color" name="accent" value="#2563eb" />
  <span data-part="preview"></span>
  <input data-part="value" type="text" aria-label="Color value" value="#2563eb" />
  <div data-part="swatches" aria-label="Suggested colors">
    <button data-part="swatch" data-value="#2563eb" type="button">Blue</button>
    <button data-part="swatch" data-value="#0f766e" type="button">Teal</button>
    <button data-part="swatch" data-value="#9333ea" type="button">Purple</button>
    <button data-part="swatch" data-value="#dc2626" type="button">Red</button>
  </div>
  <p data-part="status"></p>
</div>
