<div data-jqs="context-menu">
  <div data-part="trigger" data-surface tabindex="0">
    Right-click, press Shift+F10, or long-press this project card.
  </div>
  <div data-part="content" aria-label="Project actions">
    <button data-part="item" data-value="open" type="button">Open</button>
    <button data-part="item" data-value="duplicate" type="button">
      Duplicate <span data-part="shortcut">⌘D</span>
    </button>
    <button data-part="checkbox-item" data-value="favorite" type="button">Favorite</button>
    <div data-part="separator"></div>
    <button data-part="item" data-value="delete" type="button">Delete</button>
  </div>
</div>
