<div data-jqs="field">
  <label data-jqs="label" for="account-password">Password</label>
  <div id="account-password-field" data-jqs="password-field">
    <input
      id="account-password"
      data-part="control"
      type="password"
      name="password"
      autocomplete="current-password"
      required
    />
    <button data-part="toggle" type="button">
      <span data-part="toggle-label">Show password</span>
    </button>
    <p data-part="status"></p>
  </div>
</div>
