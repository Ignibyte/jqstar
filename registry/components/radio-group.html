<fieldset data-jqs="radio-group">
  <legend>Notification frequency</legend>
  <label>
    <input type="radio" name="frequency" value="daily" checked />
    <span>Daily</span>
  </label>
  <label>
    <input type="radio" name="frequency" value="weekly" />
    <span>Weekly</span>
  </label>
  <label>
    <input type="radio" name="frequency" value="never" />
    <span>Never</span>
  </label>
</fieldset>
