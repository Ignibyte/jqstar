<div data-jqs="split-button" role="group" aria-label="Save changes">
  <button data-jqs="button" data-part="primary" type="button">Save changes</button>
  <div data-jqs="menu" data-part="menu">
    <button data-jqs="button" data-part="trigger" type="button" aria-label="More save options">
      <span aria-hidden="true">⌄</span>
    </button>
    <div data-part="content" aria-label="Save options">
      <button data-part="item" data-value="draft" type="button">Save as draft</button>
      <button data-part="item" data-value="template" type="button">Save as template</button>
    </div>
  </div>
</div>
