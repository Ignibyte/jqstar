title = "jQuery Star secret policy"

[extend]
useDefault = true

[allowlist]
description = "Generated and dependency artifacts are not source inputs"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)demo-dist/''',
  '''(^|/)server-dist/''',
  '''(^|/)coverage/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/'''
]
