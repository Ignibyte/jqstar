rules:
  - id: jqstar.dynamic-eval-outside-trusted-engine
    message: Dynamic evaluation is allowed only in the trusted expression engine.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      exclude:
        - /src/expression.ts
        - /test/**
        - /scripts/quality/static-self-test.mjs
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)

  - id: jqstar.production-test-import
    message: Production code cannot import test-only libraries.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include:
        - /src/**
        - /server/**
        - /registry/blocks/**
        - /bin/**
    pattern-regex: >-
      (?:from\s+|import\s*\(|require\s*\()\s*["'](?:vitest|@playwright/test|jsdom)["']

  - id: jqstar.unowned-global-write
    message: Runtime global writes must go through an owned host capability.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include:
        - /src/**
        - /server/**
        - /registry/blocks/**
    pattern-either:
      - pattern: globalThis.$PROPERTY = $VALUE
      - pattern: window.$PROPERTY = $VALUE

  - id: jqstar.shell-command-interpolation
    message: Do not interpolate values into a shell command. Pass an argv array without a shell.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - patterns:
          - pattern: child_process.exec($COMMAND, ...)
          - metavariable-regex:
              metavariable: $COMMAND
              regex: ".*(`|\\+).*"
      - pattern: "spawn($COMMAND, $ARGS, { ..., shell: true, ... })"

  - id: jqstar.handwritten-datastar-event
    message: Server Datastar events must be generated by @starfederation/datastar-sdk.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      include:
        - /server/**
        - /registry/blocks/**
    pattern-regex: '(event|data):\s*(datastar|jquery-star)-(patch|execute)'

  - id: jqstar.private-package-entry
    message: Import only declared jquery-star package entry points.
    severity: ERROR
    languages: [javascript, typescript]
    paths:
      exclude:
        - /scripts/quality-package.mjs
        - /scripts/quality/tool-self-test.mjs
    pattern-regex: >-
      (?:from\s+|import\s*\(|require\s*\()\s*["']jquery-star/(?:src|dist|internal)/
