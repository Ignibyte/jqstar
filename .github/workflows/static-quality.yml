name: Static quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Install pinned local security analyzers
        run: |
          install_go_analyzer() {
            local go_module="$1"
            local attempt
            for attempt in 1 2 3; do
              if go install "$go_module"; then
                return 0
              fi
              if [[ "$attempt" -eq 3 ]]; then
                return 1
              fi
              printf 'Retrying %s after attempt %s of 3 failed\n' "$go_module" "$attempt" >&2
              sleep "$((attempt * 10))"
            done
          }
          python -m pip install semgrep==1.166.0
          install_go_analyzer github.com/zricethezav/gitleaks/v8@v8.30.1
          install_go_analyzer github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          install_go_analyzer github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - run: npm run quality:static:delivery
      - name: Retain static quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-quality-${{ github.run_attempt }}
          path: .git/jqstar
          if-no-files-found: error
          retention-days: 14
