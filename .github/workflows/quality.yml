name: quality

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delivery:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: delivery (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Install pinned external analyzers
        run: |
          python -m pip install semgrep==1.166.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run quality:delivery
        env:
          JQS_QUALITY_BASE_SHA:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-delivery-${{ github.run_attempt }}
          path: .git/jqstar
          if-no-files-found: warn
          retention-days: 14

  full-audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: full audit (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: npm ci
      - name: Install pinned external analyzers
        run: |
          python -m pip install semgrep==1.166.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.5.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          sudo apt-get update
          sudo apt-get install --yes shellcheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run quality:full-audit
      - name: Retain quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-full-audit-${{ github.run_attempt }}
          path: .git/jqstar
          if-no-files-found: warn
          retention-days: 30
